<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Quality Predictor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8 col-md-10">

            <div class="main-card shadow-lg">

                <div class="p-4">

                    <h1 class="text-center mb-2">
                        🌙 Sleep Quality Predictor
                    </h1>

                    <p class="text-center subtitle mb-5">
                        Analyze your sleep habits with Machine Learning
                    </p>

                    <form action="/predict" method="POST">

                        <div class="mb-4">
                            <label class="form-label">
                                Sleep Duration (Hours)
                            </label>

                            <input
                                type="number"
                                step="0.1"
                                class="form-control"
                                name="sleep_duration"
                                value="{{ sleep_duration if sleep_duration else '' }}"
                                required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                Caffeine Intake
                            </label>

                            <select class="form-select" name="caffeine">

                                <option {% if caffeine=="Low" %}selected{% endif %}>Low</option>

                                <option {% if caffeine=="Moderate" %}selected{% endif %}>Moderate</option>

                                <option {% if caffeine=="High" %}selected{% endif %}>High</option>

                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                Exercise Duration (Minutes)
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                name="exercise"
                                value="{{ exercise if exercise else '' }}"
                                required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                Screen Time Before Bed (Minutes)
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                name="screen_time"
                                value="{{ screen_time if screen_time else '' }}"
                                required>
                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Stress Level:
                                <span id="stressValue">
                                    {{ stress if stress is defined else 5 }}
                                </span>
                            </label>

                            <input
                                type="range"
                                class="form-range"
                                min="0"
                                max="10"
                                id="stress"
                                name="stress"
                                value="{{ stress if stress is defined else 5 }}">

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Mood Before Sleep
                            </label>

                            <select class="form-select" name="mood">

                                <option {% if mood=="Happy" %}selected{% endif %}>Happy</option>

                                <option {% if mood=="Neutral" %}selected{% endif %}>Neutral</option>

                                <option {% if mood=="Sad" %}selected{% endif %}>Sad</option>

                                <option {% if mood=="Anxious" %}selected{% endif %}>Anxious</option>

                            </select>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Sleep Interruptions
                            </label>

                            <select class="form-select" name="interruptions">

                                <option {% if interruptions=="No" %}selected{% endif %}>No</option>

                                <option {% if interruptions=="Yes" %}selected{% endif %}>Yes</option>

                            </select>

                        </div>

                        <div class="d-grid">

                            <button type="submit" class="btn btn-primary btn-lg">
                                Predict Sleep Quality
                            </button>

                        </div>

                    </form>

                    {% if prediction %}

                    <div class="result-card">

                        <h3 class="result-title">
                            Prediction Result
                        </h3>

                        {% if prediction == "Good" %}

                            <div class="prediction good">
                                😴 Good Sleep
                            </div>

                            <div class="progress mt-3">
                                <div class="progress-bar bg-success progress-bar-striped progress-bar-animated"
                                     style="width:95%">
                                     95%
                                </div>
                            </div>

                        {% elif prediction == "Average" %}

                            <div class="prediction average">
                                😐 Average Sleep
                            </div>

                            <div class="progress mt-3">
                                <div class="progress-bar bg-warning progress-bar-striped progress-bar-animated"
                                     style="width:70%">
                                     70%
                                </div>
                            </div>

                        {% else %}

                            <div class="prediction poor">
                                ⚠ Poor Sleep
                            </div>

                            <div class="progress mt-3">
                                <div class="progress-bar bg-danger progress-bar-striped progress-bar-animated"
                                     style="width:40%">
                                     40%
                                </div>
                            </div>

                        {% endif %}

                        <div class="tip mt-4">
                            💡 {{ tip }}
                        </div>

                    </div>

                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</div>


<script>

const stressSlider = document.getElementById("stress");
const stressValue = document.getElementById("stressValue");

stressSlider.addEventListener("input", function () {
    stressValue.textContent = this.value;
});

</script>

</body>
</html>
